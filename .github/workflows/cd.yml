name: CD

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,REPO,POSTGRES_DSN,JWT_SECRET
          script: |
            docker pull ghcr.io/${REPO}/backend:${TAG}
            docker pull ghcr.io/${REPO}/frontend:${TAG}

            docker stop backend frontend || true
            docker rm backend frontend || true

            docker run -d \
              --name backend \
              --network host \
              --restart unless-stopped \
              -e POSTGRES_DSN="${POSTGRES_DSN}" \
              -e JWT_SECRET="${JWT_SECRET}" \
              ghcr.io/${REPO}/backend:${TAG}

            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              ghcr.io/${REPO}/frontend:${TAG}
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
