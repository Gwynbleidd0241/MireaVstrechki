name: CD

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Prepare deploy vars
        run: |
          echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "TAG=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,REPO,POSTGRES_DSN,JWT_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM
          script: |
            docker pull ghcr.io/${REPO}/backend:${TAG}
            docker pull ghcr.io/${REPO}/frontend:${TAG}

            docker stop backend frontend || true
            docker rm backend frontend || true

            docker run --rm \
              --network host \
              -e POSTGRES_DSN="${POSTGRES_DSN}" \
              ghcr.io/${REPO}/backend:${TAG} migrate

            docker run -d \
              --name backend \
              --network host \
              --restart unless-stopped \
              -e POSTGRES_DSN="${POSTGRES_DSN}" \
              -e JWT_SECRET="${JWT_SECRET}" \
              -e SMTP_HOST="${SMTP_HOST}" \
              -e SMTP_PORT="${SMTP_PORT}" \
              -e SMTP_USERNAME="${SMTP_USERNAME}" \
              -e SMTP_PASSWORD="${SMTP_PASSWORD}" \
              -e SMTP_FROM="${SMTP_FROM}" \
              ghcr.io/${REPO}/backend:${TAG}

            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              ghcr.io/${REPO}/frontend:${TAG}
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
