name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      - name: Fuzz smoke — IsValidEmail
        run: go test -run=^$ -fuzz=FuzzIsValidEmail -fuzztime=10s ./internal/validation

      - name: Fuzz smoke — ParseToken
        run: go test -run=^$ -fuzz=FuzzParseToken -fuzztime=10s ./internal/auth

      - name: Fuzz smoke — IsValidTaskStatus
        run: go test -run=^$ -fuzz=FuzzIsValidTaskStatus -fuzztime=10s ./internal/service

      - name: Fuzz smoke — eventIDFromPath
        run: go test -run=^$ -fuzz=FuzzEventIDFromPath -fuzztime=10s ./internal/http/handlers

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: CI=true npm test

      - name: Build
        run: npm run build
